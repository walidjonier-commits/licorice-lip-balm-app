name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add web platform files
        run: flutter create . --platforms web --project-name licorice_lip_balm

      - name: Set app icon and name
        run: |
          pip install pillow
          python3 - <<'PY'
          import glob
          from PIL import Image, ImageOps
          src = sorted(glob.glob("IMG_*"))[0]
          print("Using", src)
          im = Image.open(src).convert("RGB")
          im = ImageOps.fit(im, (512, 512))
          for name, size in [("Icon-192", 192), ("Icon-512", 512), ("Icon-maskable-192", 192), ("Icon-maskable-512", 512)]:
              im.resize((size, size)).save(f"web/icons/{name}.png")
          im.resize((64, 64)).save("web/favicon.png")
          PY
          sed -i 's/licorice_lip_balm/Licorice Balm/g' web/index.html

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
