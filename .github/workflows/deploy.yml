name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Add web platform files
      - name: Set app icon and name
        run:  sudo apt-get install -y imagemagick
          convert IMG_2256.jpeg -resize 512x512^ -gravity center -extent 512x512 icon.png
          for f in Icon-192 Icon-512 Icon-maskable-192 Icon-maskable-512; do cp icon.png web/icons/$f.png; done
          cp icon.png web/favicon.png
          sed -i 's/licorice_lip_balm/Licorice Balm/g' web/index.html
        run: flutter create . --platforms web --project-name licorice_lip_balm
      - run: flutter pub get
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
